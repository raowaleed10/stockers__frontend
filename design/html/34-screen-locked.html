<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>34 Screen locked</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#110D0A}
button{font:inherit;cursor:pointer}
a{color:#E0AE52}a:hover{color:#F0C670}
</style>

<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<div style="min-height: 900px; background: #110D0A; color: #F3ECDD; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-wrap: wrap">

  <section style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 48px 56px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: #1E6B45; box-shadow: inset -6px -6px 0 rgba(0,0,0,0.28); display: inline-block"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px">Stockers</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 140px; line-height: 0.9">11:06</span>
      <span style="font-size: 26px; color: #D9CDB8">PM, Saturday 3 October</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 18px; color: #B9AC97">Tables right now</span>
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <span style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 12px; background: #2E1918; font-size: 18px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #F0574F"></span>5 playing</span>
        <span style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 12px; background: #2E1918; font-size: 18px"><span style="width: 10px; height: 14px; border-radius: 2px; background: #F0574F; transform: rotate(-12deg)"></span>1 over 30 min</span>
        <span style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 12px; background: #172419; font-size: 18px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #48C07F"></span>2 free</span>
        <span style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 12px; background: #25272A; font-size: 18px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #9AA0A6"></span>1 out of order</span>
      </div>
    </div>
    <span style="font-size: 17px; color: #B9AC97">Locked after 5 minutes without a tap. Games keep running while the screen is locked.</span>
  </section>

  <section style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 40px 32px; background: #16110D; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E0AE52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700">Zain, enter your PIN</h1>
    </div>
    <div aria-label="No digits entered" style="display: flex; gap: 18px">
      <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #6B5640; box-sizing: border-box"></span>
      <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #6B5640; box-sizing: border-box"></span>
      <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #6B5640; box-sizing: border-box"></span>
      <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #6B5640; box-sizing: border-box"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 380px">
      <button style="min-height: 80px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 600">1</button>
      <button style="min-height: 80px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 600">2</button>
      <button style="min-height: 80px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 600">3</button>
      <button style="min-height: 80px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 600">4</button>
      <button style="min-height: 80px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 600">5</button>
      <button style="min-height: 80px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 600">6</button>
      <button style="min-height: 80px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 600">7</button>
      <button style="min-height: 80px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 600">8</button>
      <button style="min-height: 80px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 600">9</button>
      <a href="W-Login.dc.html" style="min-height: 80px; border-radius: 16px; color: #B9AC97; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none; text-align: center">Switch worker</a>
      <button style="min-height: 80px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 600">0</button>
      <button aria-label="Delete last digit" style="min-height: 80px; border-radius: 16px; border: 0; background: transparent; color: #B9AC97; display: flex; align-items: center; justify-content: center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="m18 9-6 6M12 9l6 6"/></svg>
      </button>
    </div>
  </section>
</div>

</body>
</html>
