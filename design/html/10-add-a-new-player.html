<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>10 Add a new player</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0A07}
button{font:inherit;cursor:pointer}
input{font:inherit}
a{color:#E0AE52}a:hover{color:#F0C670}
</style>

<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<div style="min-height: 900px; background: #0D0A07; color: #F3ECDD; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 14px 24px; background: #0B0806; border-bottom: 1px solid #2A2119; opacity: 0.55">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #1E6B45; display: inline-block"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px">Stockers</span>
    </div>
    <span style="font-size: 17px; font-weight: 600">Sheet 48</span>
    <div style="flex: 1 1 0"></div>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px">9:47 PM</span>
  </header>

  <main style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 28px 24px">
    <section role="dialog" aria-labelledby="np" style="width: 100%; max-width: 1100px; background: #211913; border: 1px solid #4A3B2E; border-radius: 26px; padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 28px; box-shadow: 0 30px 80px rgba(0,0,0,0.55)">
      <div style="flex: 3 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 id="np" style="margin: 0; font-size: 28px; font-weight: 700">Add a new player</h1>
          <span style="font-size: 17px; color: #B9AC97">Their account is made now, so games and payments go under their name.</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="nm" style="font-size: 18px; font-weight: 600">Full name</label>
          <input id="nm" value="Ali Shahzad" style="min-height: 64px; padding: 0 18px; border-radius: 14px; background: #16110D; border: 2px solid #4A3B2E; color: #F3ECDD; font-size: 22px; box-sizing: border-box">
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="ph" style="font-size: 18px; font-weight: 600">Phone number <span style="font-weight: 400; color: #B9AC97">(can be added later)</span></label>
          <input id="ph" value="0302 81" inputmode="numeric" style="min-height: 64px; padding: 0 18px; border-radius: 14px; background: #16110D; border: 2px solid #E0AE52; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; letter-spacing: 1px; box-sizing: border-box">
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border-radius: 16px; background: #2A2216; border: 1px solid #8C6E2E">
          <span style="font-size: 17px; font-weight: 700; color: #F5D488">Similar names already saved</span>
          <span style="font-size: 16px; color: #D9CDB8">Is it one of these? Tap to use them instead.</span>
          <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px">
            <button style="min-height: 56px; padding: 0 16px; border-radius: 12px; border: 1px solid #8C6E2E; background: #211913; color: #F3ECDD; font-size: 17px"><b>Ali Shah</b> <span style="color: #B9AC97">•••• 4470</span></button>
            <button style="min-height: 56px; padding: 0 16px; border-radius: 12px; border: 1px solid #8C6E2E; background: #211913; color: #F3ECDD; font-size: 17px"><b>Ali Haider</b> <span style="color: #B9AC97">•••• 5520</span></button>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px">
          <button style="min-height: 64px; padding: 0 24px; border-radius: 14px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-size: 19px; font-weight: 600">Cancel</button>
          <div style="flex: 1 1 0"></div>
          <button style="min-height: 64px; padding: 0 24px; border-radius: 14px; border: 1px solid #6B5640; background: transparent; color: #F3ECDD; font-size: 19px; font-weight: 600">Skip phone for now</button>
          <button style="min-height: 64px; padding: 0 32px; border-radius: 14px; border: 0; background: #E0AE52; color: #1B140D; font-size: 20px; font-weight: 700">Add player</button>
        </div>
      </div>

      <div style="flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 20px; background: #2B2119; border: 1px solid #3B2F25">
        <span style="font-size: 16px; color: #B9AC97">Phone keypad</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <button style="min-height: 72px; border-radius: 14px; border: 1px solid #4A3B2E; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 600">1</button>
          <button style="min-height: 72px; border-radius: 14px; border: 1px solid #4A3B2E; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 600">2</button>
          <button style="min-height: 72px; border-radius: 14px; border: 1px solid #4A3B2E; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 600">3</button>
          <button style="min-height: 72px; border-radius: 14px; border: 1px solid #4A3B2E; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 600">4</button>
          <button style="min-height: 72px; border-radius: 14px; border: 1px solid #4A3B2E; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 600">5</button>
          <button style="min-height: 72px; border-radius: 14px; border: 1px solid #4A3B2E; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 600">6</button>
          <button style="min-height: 72px; border-radius: 14px; border: 1px solid #4A3B2E; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 600">7</button>
          <button style="min-height: 72px; border-radius: 14px; border: 1px solid #4A3B2E; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 600">8</button>
          <button style="min-height: 72px; border-radius: 14px; border: 1px solid #4A3B2E; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 600">9</button>
          <div></div>
          <button style="min-height: 72px; border-radius: 14px; border: 1px solid #4A3B2E; background: #211913; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 600">0</button>
          <button aria-label="Delete last digit" style="min-height: 72px; border-radius: 14px; border: 0; background: transparent; color: #B9AC97; display: flex; align-items: center; justify-content: center">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="m18 9-6 6M12 9l6 6"/></svg>
          </button>
        </div>
      </div>
    </section>
  </main>
</div>

</body>
</html>
