<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>18 Frame charged, next frame</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0A07}
button{font:inherit;cursor:pointer}
a{color:#E0AE52}a:hover{color:#F0C670}
</style>

<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<div style="min-height: 900px; background: #0D0A07; color: #F3ECDD; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 14px 24px; background: #0B0806; border-bottom: 1px solid #2A2119; opacity: 0.55">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #1E6B45; display: inline-block"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px">Stockers</span>
    </div>
    <span style="font-size: 17px; font-weight: 600">Sheet 48</span>
    <div style="flex: 1 1 0"></div>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px">9:51 PM</span>
  </header>

  <main style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 28px 24px">
    <section role="dialog" aria-labelledby="nf" style="width: 100%; max-width: 1040px; background: #211913; border: 1px solid #4A3B2E; border-radius: 26px; padding: 30px 32px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 30px 80px rgba(0,0,0,0.55)">
      <div style="display: flex; align-items: center; gap: 18px">
        <span style="width: 64px; height: 64px; border-radius: 50%; background: #1E6B45; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F3ECDD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 id="nf" style="margin: 0; font-size: 30px; font-weight: 700">Rs 250 added to Bilal Ahmed’s bill</h1>
          <span style="font-size: 18px; color: #B9AC97">He now has Rs 850 waiting to pay. Ali Raza won frame 3.</span>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border-radius: 18px; background: #1B2232; border: 1px solid #3A5A8C">
        <span style="font-size: 18px; color: #A9C9FA">Table 1 session, 3 frames</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 700">Ali 3 – 0 Bilal</span>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 14px">
        <button style="flex: 2 1 420px; min-height: 120px; border-radius: 20px; border: 0; background: #E0AE52; color: #1B140D; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 0 26px; text-align: left">
          <span style="font-size: 26px; font-weight: 700">Next frame, same players</span>
          <span style="font-size: 17px; font-weight: 500">Frame 4 starts now, Rs 250</span>
        </button>
        <button style="flex: 1 1 220px; min-height: 120px; border-radius: 20px; border: 1px solid #4A3B2E; background: #2B2119; color: #F3ECDD; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 0 22px; text-align: left">
          <span style="font-size: 22px; font-weight: 700">Change players</span>
          <span style="font-size: 16px; color: #B9AC97">New frame on Table 1</span>
        </button>
        <button style="flex: 1 1 220px; min-height: 120px; border-radius: 20px; border: 1px solid #4A3B2E; background: #2B2119; color: #F3ECDD; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 0 22px; text-align: left">
          <span style="font-size: 22px; font-weight: 700">Free the table</span>
          <span style="font-size: 16px; color: #B9AC97">Players are done</span>
        </button>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
        <span style="font-size: 16px; color: #B9AC97">Tapped the wrong player?</span>
        <button style="min-height: 56px; padding: 0 20px; border-radius: 12px; border: 1px solid #4A3B2E; background: transparent; color: #F3ECDD; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          Undo, 1:56 left
        </button>
      </div>
    </section>
  </main>
</div>

</body>
</html>
