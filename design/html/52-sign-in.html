<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>52 Sign in</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Noto+Nastaliq+Urdu:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF2EF}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:#1E6B45}a:hover{color:#0E5E31}
:focus-visible{outline:3px solid #2A6FD6;outline-offset:2px}

</style>

<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<div style="width: 390px; min-height: 844px; margin: 0 auto; background: #EEF2EF; color: #1D1A16; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 40px 20px 10px">
    <div style="display: flex; align-items: center; gap: 10px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #1E6B45; box-shadow: inset -6px -6px 0 rgba(0,0,0,0.28)"></span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 42px">Stockers</span></div>
    <span style="font-size: 17px; color: #5F5A52">Snooker club, Mian Plaza</span>
  </header>
  <main style="flex: 1 0 auto; padding: 6px 16px 22px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 12px 0 0; font-size: 26px; font-weight: 700">Sign in</h1>
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 16px; font-weight: 600; padding-bottom: 8px">Who is signing in?</legend>
        <label style="min-height: 64px; padding: 0 14px; border-radius: 14px; border: 2px solid #1E6B45; background: #E3F0E8; display: flex; align-items: center; gap: 12px">
          <input type="radio" name="who" checked style="width: 22px; height: 22px; accent-color: #1E6B45">
          <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: #1E6B45; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">AF</span>
          <span style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700">Aqil Farooq</span><span style="font-size: 14px; color: #5F5A52">Owner</span></span>
        </label>
        <label style="min-height: 64px; padding: 0 14px; border-radius: 14px; border: 1px solid #DCE3DE; background: #FFFFFF; display: flex; align-items: center; gap: 12px">
          <input type="radio" name="who"  style="width: 22px; height: 22px; accent-color: #1E6B45">
          <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: #2A6FD6; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">AF</span>
          <span style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700">Adil Farooq</span><span style="font-size: 14px; color: #5F5A52">Owner</span></span>
        </label>
    </fieldset>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pw" style="font-size: 16px; font-weight: 600">Password</label>
      <div style="display: flex; align-items: center; min-height: 56px; padding: 0 6px 0 14px; border-radius: 12px; border: 2px solid #2A6FD6; background: #FFFFFF">
        <input id="pw" type="password" value="stockers48" style="flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font-size: 20px; outline: none">
        <button aria-label="Show password" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F5A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <label style="min-height: 48px; display: flex; align-items: center; gap: 12px; font-size: 16px"><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1E6B45">Keep me signed in on this phone</label>
    <a href="P-Dashboard.dc.html" style="min-height: 56px; border-radius: 14px; background: #1E6B45; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; text-decoration: none">Sign in</a>
    <span style="font-size: 15px; color: #5F5A52; line-height: 1.4">This is the private owner address. Forgot the password? The other owner can set a new one in Settings.</span>
    <div role="group" aria-label="Language" style="display: flex; gap: 6px; margin-top: 4px">
      <button aria-pressed="true" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #1D1A16; background: #FFFFFF; font-size: 15px; font-weight: 700">English</button>
      <button aria-pressed="false" lang="ur" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #DCE3DE; background: #FFFFFF; font-family: 'Noto Nastaliq Urdu', serif; font-size: 16px; line-height: 1">اردو</button>
    </div>
  </main>

</div>

</body>
</html>
