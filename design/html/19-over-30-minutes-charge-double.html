<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>19 Over 30 minutes: charge double?</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0A07}
button{font:inherit;cursor:pointer}
a{color:#E0AE52}a:hover{color:#F0C670}
</style>

<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<div style="min-height: 900px; background: #0D0A07; color: #F3ECDD; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 14px 24px; background: #0B0806; border-bottom: 1px solid #2A2119; opacity: 0.55">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #1E6B45; display: inline-block"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px">Stockers</span>
    </div>
    <span style="font-size: 17px; font-weight: 600">Sheet 48</span>
    <div style="flex: 1 1 0"></div>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px">9:46 PM</span>
  </header>

  <main style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 28px 24px">
    <section role="dialog" aria-labelledby="ot" style="width: 100%; max-width: 1000px; background: #211913; border: 2px solid #A8403A; border-radius: 26px; padding: 30px 32px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 30px 80px rgba(0,0,0,0.55)">
      <div style="display: flex; align-items: flex-start; gap: 18px">
        <span style="width: 64px; height: 64px; border-radius: 50%; background: #F0574F; box-shadow: inset -8px -8px 0 rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1B140D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </span>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 17px; color: #F7A29C; font-weight: 600">Table 4 ran over 30 minutes</span>
          <h1 id="ot" style="margin: 0; font-size: 32px; font-weight: 700">This frame took 36 minutes. Charge double?</h1>
          <span style="font-size: 18px; color: #B9AC97">Zubair Khan lost to Usman Tariq. Choose what Zubair pays.</span>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 16px">
        <button style="flex: 1 1 340px; min-height: 170px; border-radius: 22px; border: 2px solid #4A3B2E; background: #2B2119; color: #F3ECDD; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; padding: 0 26px; text-align: left">
          <span style="font-size: 22px; font-weight: 600">Normal price</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 58px; font-weight: 700; line-height: 1">Rs 200</span>
        </button>
        <button style="flex: 1 1 340px; min-height: 170px; border-radius: 22px; border: 2px solid #A8403A; background: #2E1918; color: #F3ECDD; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; padding: 0 26px; text-align: left">
          <span style="font-size: 22px; font-weight: 600; color: #F7A29C">Double price</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 58px; font-weight: 700; line-height: 1">Rs 400</span>
        </button>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <span style="font-size: 16px; color: #B9AC97">The timer showed a red card at 30 minutes. Owners see which frames were charged double.</span>
        <div style="flex: 1 1 0"></div>
        <button style="min-height: 60px; padding: 0 24px; border-radius: 14px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-size: 18px; font-weight: 600">Back</button>
      </div>
    </section>
  </main>
</div>

</body>
</html>
