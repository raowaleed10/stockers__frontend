<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>28 Canteen sale</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#16110D}
button{font:inherit;cursor:pointer}
a{color:#E0AE52}a:hover{color:#F0C670}
</style>

<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<div style="min-height: 900px; background: #16110D; color: #F3ECDD; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 18px; padding: 14px 24px; background: #110D0A; border-bottom: 1px solid #3B2F25">
    <a href="Main.dc.html" style="min-height: 56px; padding: 0 18px; border-radius: 14px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Tables
    </a>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">Canteen</h1>
    <div style="flex: 1 1 0"></div>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px">9:55 PM</span>
  </header>

  <main style="flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 20px; padding: 18px 24px 24px; align-items: flex-start">
    <section aria-label="Items" style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
      <div role="group" aria-label="Item type" style="display: flex; flex-wrap: wrap; gap: 10px">
        <button aria-pressed="true" style="min-height: 56px; padding: 0 22px; border-radius: 14px; border: 2px solid #E0AE52; background: #2B2119; color: #F3ECDD; font-size: 18px; font-weight: 700">All</button>
        <button aria-pressed="false" style="min-height: 56px; padding: 0 22px; border-radius: 14px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; font-size: 18px">Drinks</button>
        <button aria-pressed="false" style="min-height: 56px; padding: 0 22px; border-radius: 14px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; font-size: 18px">Food</button>
        <button aria-pressed="false" style="min-height: 56px; padding: 0 22px; border-radius: 14px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; font-size: 18px">Cigarettes</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
        <button style="min-height: 120px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; text-align: left">
          <span style="font-size: 19px; font-weight: 700">Tea</span>
          <span style="display: flex; justify-content: space-between; width: 100%; align-items: baseline"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600">Rs 50</span><span style="font-size: 14px; color: #B9AC97">Made fresh</span></span>
        </button>
        <button style="min-height: 120px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; text-align: left">
          <span style="font-size: 19px; font-weight: 700">Green tea</span>
          <span style="display: flex; justify-content: space-between; width: 100%; align-items: baseline"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600">Rs 60</span><span style="font-size: 14px; color: #B9AC97">Made fresh</span></span>
        </button>
        <button style="min-height: 120px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; text-align: left">
          <span style="font-size: 19px; font-weight: 700">Coffee</span>
          <span style="display: flex; justify-content: space-between; width: 100%; align-items: baseline"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600">Rs 120</span><span style="font-size: 14px; color: #B9AC97">Made fresh</span></span>
        </button>
        <button style="min-height: 120px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; text-align: left">
          <span style="font-size: 19px; font-weight: 700">Water, small</span>
          <span style="display: flex; justify-content: space-between; width: 100%; align-items: baseline"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600">Rs 70</span><span style="font-size: 14px; color: #B9AC97">34 left</span></span>
        </button>
        <button style="min-height: 120px; border-radius: 16px; border: 2px solid #E0AE52; background: #33271C; color: #F3ECDD; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; text-align: left">
          <span style="display: flex; justify-content: space-between; width: 100%"><span style="font-size: 19px; font-weight: 700">Cold drink</span><span style="min-width: 30px; height: 30px; border-radius: 15px; background: #E0AE52; color: #1B140D; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span></span>
          <span style="display: flex; justify-content: space-between; width: 100%; align-items: baseline"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600">Rs 120</span><span style="font-size: 14px; color: #B9AC97">24 left</span></span>
        </button>
        <button style="min-height: 120px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; text-align: left">
          <span style="font-size: 19px; font-weight: 700">Energy drink</span>
          <span style="display: flex; justify-content: space-between; width: 100%; align-items: baseline"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600">Rs 250</span><span style="font-size: 14px; color: #B9AC97">8 left</span></span>
        </button>
        <button style="min-height: 120px; border-radius: 16px; border: 2px solid #E0AE52; background: #33271C; color: #F3ECDD; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; text-align: left">
          <span style="display: flex; justify-content: space-between; width: 100%"><span style="font-size: 19px; font-weight: 700">Chips</span><span style="min-width: 30px; height: 30px; border-radius: 15px; background: #E0AE52; color: #1B140D; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span></span>
          <span style="display: flex; justify-content: space-between; width: 100%; align-items: baseline"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600">Rs 60</span><span style="font-size: 14px; color: #F5D488; font-weight: 600">3 left, low</span></span>
        </button>
        <button style="min-height: 120px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; text-align: left">
          <span style="font-size: 19px; font-weight: 700">Biscuits</span>
          <span style="display: flex; justify-content: space-between; width: 100%; align-items: baseline"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600">Rs 40</span><span style="font-size: 14px; color: #B9AC97">18 left</span></span>
        </button>
        <button style="min-height: 120px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; text-align: left">
          <span style="font-size: 19px; font-weight: 700">Samosa</span>
          <span style="display: flex; justify-content: space-between; width: 100%; align-items: baseline"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600">Rs 50</span><span style="font-size: 14px; color: #B9AC97">12 left</span></span>
        </button>
        <button style="min-height: 120px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; text-align: left">
          <span style="font-size: 19px; font-weight: 700">Nimco</span>
          <span style="display: flex; justify-content: space-between; width: 100%; align-items: baseline"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600">Rs 80</span><span style="font-size: 14px; color: #B9AC97">15 left</span></span>
        </button>
        <button style="min-height: 120px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; text-align: left">
          <span style="font-size: 19px; font-weight: 700">Cigarette, single</span>
          <span style="display: flex; justify-content: space-between; width: 100%; align-items: baseline"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600">Rs 40</span><span style="font-size: 14px; color: #B9AC97">60 left</span></span>
        </button>
        <button disabled style="min-height: 120px; border-radius: 16px; border: 1px dashed #5A4A3C; background: #1F1915; color: #8C7B6B; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; cursor: not-allowed">
          <span style="font-size: 19px; font-weight: 700">Cigarette pack</span>
          <span style="display: flex; justify-content: space-between; width: 100%; align-items: baseline"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600">Rs 650</span><span style="font-size: 14px; color: #F7A29C; font-weight: 600">Sold out</span></span>
        </button>
      </div>
    </section>

    <aside aria-label="Order" style="flex: 1 1 380px; min-width: 0; background: #211913; border: 1px solid #3B2F25; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-size: 21px; font-weight: 700">Charge to</h2>
      <div role="group" aria-label="Charge to" style="display: flex; background: #16110D; border: 1px solid #3B2F25; border-radius: 14px; padding: 4px">
        <button aria-pressed="true" style="flex: 1 1 0; min-height: 56px; border: 0; border-radius: 11px; background: #3A2D21; color: #F3ECDD; font-size: 17px; font-weight: 600">A player</button>
        <button aria-pressed="false" style="flex: 1 1 0; min-height: 56px; border: 0; border-radius: 11px; background: transparent; color: #B9AC97; font-size: 17px">Cash sale, no name</button>
      </div>
      <div style="min-height: 72px; border-radius: 14px; background: #1E2A22; border: 2px solid #2F6B48; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box">
        <span style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 700">Usman Tariq</span><span style="font-size: 15px; color: #B9AC97">•••• 7731, playing on Table 4</span></span>
        <button style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #3B2F25; background: transparent; color: #F3ECDD; font-size: 16px">Change</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
        <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #3B2F25">
          <span style="flex: 1 1 auto; font-size: 18px; font-weight: 600">Cold drink</span>
          <button aria-label="One less cold drink" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #4A3B2E; background: #2B2119; color: #F3ECDD; font-size: 24px">−</button>
          <span style="min-width: 24px; text-align: center; font-size: 20px; font-weight: 700">2</span>
          <button aria-label="One more cold drink" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #4A3B2E; background: #2B2119; color: #F3ECDD; font-size: 24px">+</button>
          <span style="min-width: 76px; text-align: right; font-size: 18px; font-weight: 600">Rs 240</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #3B2F25">
          <span style="flex: 1 1 auto; font-size: 18px; font-weight: 600">Chips</span>
          <button aria-label="One less chips" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #4A3B2E; background: #2B2119; color: #F3ECDD; font-size: 24px">−</button>
          <span style="min-width: 24px; text-align: center; font-size: 20px; font-weight: 700">1</span>
          <button aria-label="One more chips" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #4A3B2E; background: #2B2119; color: #F3ECDD; font-size: 24px">+</button>
          <span style="min-width: 76px; text-align: right; font-size: 18px; font-weight: 600">Rs 60</span>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px">
        <span style="font-size: 20px; font-weight: 700">Total</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 48px; font-weight: 700">Rs 300</span>
      </div>
      <button style="min-height: 76px; border-radius: 16px; border: 0; background: #E0AE52; color: #1B140D; font-size: 21px; font-weight: 700">Add Rs 300 to Usman’s bill</button>
      <span style="font-size: 15px; color: #B9AC97">It is paid at checkout with his games. For a cash sale, the money is taken now.</span>
    </aside>
  </main>
</div>

</body>
</html>
