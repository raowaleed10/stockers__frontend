<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>17 End a frame: who lost?</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0A07}
button{font:inherit;cursor:pointer}
a{color:#E0AE52}a:hover{color:#F0C670}
</style>

<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<div style="min-height: 900px; background: #0D0A07; color: #F3ECDD; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 14px 24px; background: #0B0806; border-bottom: 1px solid #2A2119; opacity: 0.55">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #1E6B45; display: inline-block"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px">Stockers</span>
    </div>
    <span style="font-size: 17px; font-weight: 600">Sheet 48</span>
    <div style="flex: 1 1 0"></div>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px">9:51 PM</span>
  </header>

  <main style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 28px 24px">
    <section role="dialog" aria-labelledby="ef" style="width: 100%; max-width: 1040px; background: #211913; border: 1px solid #4A3B2E; border-radius: 26px; padding: 30px 32px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 30px 80px rgba(0,0,0,0.55)">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 17px; color: #B9AC97">Table 1, frame 3 ended at 9:51 PM after 28 minutes</span>
          <h1 id="ef" style="margin: 0; font-size: 36px; font-weight: 700">Who lost this frame?</h1>
        </div>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 600">Rs 250</span>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 18px">
        <button style="flex: 1 1 360px; min-height: 220px; border-radius: 22px; border: 2px solid #4A3B2E; background: #2B2119; color: #F3ECDD; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 24px 26px; text-align: left">
          <span style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 34px; font-weight: 700">Ali Raza</span>
            <span style="font-size: 18px; color: #B9AC97">0300 •••• 1964</span>
          </span>
          <span style="display: flex; justify-content: space-between; width: 100%; font-size: 18px; color: #D9CDB8"><span>Won 2 frames tonight</span><span>Owes nothing</span></span>
        </button>
        <button style="flex: 1 1 360px; min-height: 220px; border-radius: 22px; border: 2px solid #4A3B2E; background: #2B2119; color: #F3ECDD; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 24px 26px; text-align: left">
          <span style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 34px; font-weight: 700">Bilal Ahmed</span>
            <span style="font-size: 18px; color: #B9AC97">0300 •••• 4512</span>
          </span>
          <span style="display: flex; justify-content: space-between; width: 100%; font-size: 18px; color: #D9CDB8"><span>Lost 2 frames, 2 teas tonight</span><span style="color: #F5D488">Rs 600 waiting</span></span>
        </button>
      </div>

      <p style="margin: 0; font-size: 17px; color: #B9AC97; text-align: center">Tap the loser. The frame price goes on his bill and the winner is recorded.</p>

      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <button style="min-height: 64px; padding: 0 24px; border-radius: 14px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          Keep playing
        </button>
        <div style="flex: 1 1 0"></div>
        <button style="min-height: 64px; padding: 0 24px; border-radius: 14px; border: 1px solid #6B3A36; background: transparent; color: #F7A29C; font-size: 18px; font-weight: 600">Nobody pays</button>
      </div>
    </section>
  </main>
</div>

</body>
</html>
