<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>15 Damage charge</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0A07}
button{font:inherit;cursor:pointer}
a{color:#E0AE52}a:hover{color:#F0C670}
</style>

<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<div style="min-height: 900px; background: #0D0A07; color: #F3ECDD; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 14px 24px; background: #0B0806; border-bottom: 1px solid #2A2119; opacity: 0.55">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #1E6B45; display: inline-block"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px">Stockers</span>
    </div>
    <span style="font-size: 17px; font-weight: 600">Sheet 48</span>
    <div style="flex: 1 1 0"></div>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px">9:45 PM</span>
  </header>

  <main style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 28px 24px">
    <section role="dialog" aria-labelledby="dm" style="width: 100%; max-width: 1060px; background: #211913; border: 2px solid #8C6E2E; border-radius: 26px; padding: 28px 32px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 30px 80px rgba(0,0,0,0.55)">
      <div style="display: flex; align-items: flex-start; gap: 18px">
        <span style="width: 64px; height: 64px; border-radius: 50%; background: #E0AE52; box-shadow: inset -8px -8px 0 rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1B140D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>
        </span>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 17px; color: #E0AE52; font-weight: 600">Table 1, Ali Raza vs Bilal Ahmed</span>
          <h1 id="dm" style="margin: 0; font-size: 32px; font-weight: 700">Add a damage charge</h1>
          <span style="font-size: 18px; color: #B9AC97">For a broken cue, a damaged ball or torn cloth. It goes on the player&#8217;s bill with a note.</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 18px; font-weight: 600">Who pays?</span>
        <div style="display: flex; flex-wrap: wrap; gap: 12px"><button aria-pressed="true" style="position: relative; flex: 1 1 300px; min-height: 84px; border-radius: 18px; border: 2px solid #E0AE52; background: #3A2D21; color: #F3ECDD; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 22px; text-align: left"><span style="font-size: 21px; font-weight: 700">Ali Raza</span><span style="font-size: 15px; color: #B9AC97">&#8226;&#8226;&#8226;&#8226; 1964</span><span style="position: absolute; top: 14px; right: 14px; width: 26px; height: 26px; border-radius: 50%; background: #E0AE52; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B140D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span></button><button aria-pressed="false" style="position: relative; flex: 1 1 300px; min-height: 84px; border-radius: 18px; border: 2px solid #4A3B2E; background: #2B2119; color: #F3ECDD; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 22px; text-align: left"><span style="font-size: 21px; font-weight: 700">Bilal Ahmed</span><span style="font-size: 15px; color: #B9AC97">&#8226;&#8226;&#8226;&#8226; 4512</span></button></div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 24px">
        <div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 18px; font-weight: 600">What was damaged?</span>
          <div style="display: flex; flex-wrap: wrap; gap: 10px"><button aria-pressed="true" style="min-height: 60px; padding: 0 24px; border-radius: 14px; border: 2px solid #E0AE52; background: #3A2D21; font-weight: 700; color: #F3ECDD; font-size: 18px">Cue</button><button aria-pressed="false" style="min-height: 60px; padding: 0 24px; border-radius: 14px; border: 1px solid #4A3B2E; background: #2B2119; color: #F3ECDD; font-size: 18px">Ball</button><button aria-pressed="false" style="min-height: 60px; padding: 0 24px; border-radius: 14px; border: 1px solid #4A3B2E; background: #2B2119; color: #F3ECDD; font-size: 18px">Cloth</button><button aria-pressed="false" style="min-height: 60px; padding: 0 24px; border-radius: 14px; border: 1px solid #4A3B2E; background: #2B2119; color: #F3ECDD; font-size: 18px">Other</button></div>
          <label for="dn" style="font-size: 18px; font-weight: 600; margin-top: 8px">Note (required)</label>
          <textarea id="dn" rows="2" style="border-radius: 14px; border: 1px solid #4A3B2E; background: #16110D; color: #F3ECDD; padding: 14px 16px; font: inherit; font-size: 18px; resize: none">Cue snapped at the joint after he hit the cushion</textarea>
        </div>
        <div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 10px">
          <label for="da" style="font-size: 18px; font-weight: 600">Amount</label>
          <div style="display: flex; align-items: center; gap: 10px; min-height: 76px; padding: 0 20px; border-radius: 16px; border: 2px solid #E0AE52; background: #16110D">
            <span style="font-size: 22px; color: #B9AC97">Rs</span>
            <input id="da" value="1,500" inputmode="numeric" style="flex: 1 1 auto; min-width: 0; border: 0; background: transparent; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 46px; font-weight: 700; outline: none">
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <button style="flex: 1 1 0; min-height: 56px; border-radius: 12px; border: 1px solid #4A3B2E; background: #2B2119; color: #F3ECDD; font-size: 17px">500</button>
            <button style="flex: 1 1 0; min-height: 56px; border-radius: 12px; border: 1px solid #4A3B2E; background: #2B2119; color: #F3ECDD; font-size: 17px">1,000</button>
            <button style="flex: 1 1 0; min-height: 56px; border-radius: 12px; border: 2px solid #E0AE52; background: #3A2D21; color: #F3ECDD; font-size: 17px; font-weight: 700">1,500</button>
            <button style="flex: 1 1 0; min-height: 56px; border-radius: 12px; border: 1px solid #4A3B2E; background: #2B2119; color: #F3ECDD; font-size: 17px">2,000</button>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <span style="flex: 1 1 360px; font-size: 16px; color: #B9AC97">Shows on Ali&#8217;s statement as a damage charge. Owners see it in Activity.</span>
        <button style="min-height: 64px; padding: 0 26px; border-radius: 14px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-size: 18px; font-weight: 600">Cancel</button>
        <button style="min-height: 64px; padding: 0 30px; border-radius: 14px; border: 0; background: #E0AE52; color: #1B140D; font-size: 19px; font-weight: 700">Add Rs 1,500 to Ali&#8217;s bill</button>
      </div>
    </section>
  </main>
</div>

</body>
</html>
