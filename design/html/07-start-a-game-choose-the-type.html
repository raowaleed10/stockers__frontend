<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>07 Start a game: choose the type</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0A07}
button{font:inherit;cursor:pointer}
a{color:#E0AE52}a:hover{color:#F0C670}
</style>

<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<div style="min-height: 900px; background: #0D0A07; color: #F3ECDD; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 14px 24px; background: #0B0806; border-bottom: 1px solid #2A2119; opacity: 0.55">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #1E6B45; display: inline-block"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px">Stockers</span>
    </div>
    <span style="font-size: 17px; font-weight: 600">Sheet 48</span>
    <div style="flex: 1 1 0"></div>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px">9:46 PM</span>
  </header>

  <main style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 32px 24px">
    <section role="dialog" aria-labelledby="t2" style="width: 100%; max-width: 980px; background: #211913; border: 1px solid #4A3B2E; border-radius: 26px; padding: 28px 32px 26px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 30px 80px rgba(0,0,0,0.55)">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
        <div style="display: flex; align-items: flex-end; gap: 14px">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 72px; line-height: 0.8">2</span>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <h1 id="t2" style="margin: 0; font-size: 26px; font-weight: 700">Table 2 is free</h1>
            <span style="font-size: 17px; color: #B9AC97">What are they playing?</span>
          </div>
        </div>
        <button aria-label="Close" style="width: 56px; height: 56px; border-radius: 14px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 14px">
        <button aria-pressed="false" style="flex: 1 1 260px; min-height: 196px; text-align: left; border-radius: 20px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; padding: 20px; display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 26px; font-weight: 700">Single frame</span>
          <span style="font-size: 17px; color: #D9CDB8; line-height: 1.4">Two players. When the frame ends, the loser pays.</span>
          <span style="margin-top: auto; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 600">Rs 250</span>
        </button>
        <button aria-pressed="false" style="flex: 1 1 260px; min-height: 196px; text-align: left; border-radius: 20px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; padding: 20px; display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 26px; font-weight: 700">Double frame</span>
          <span style="font-size: 17px; color: #D9CDB8; line-height: 1.4">Two against two, or one against two. The losing side splits it.</span>
          <span style="margin-top: auto; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 600">Rs 500</span>
        </button>
        <button aria-pressed="true" style="flex: 1 1 260px; min-height: 196px; text-align: left; border-radius: 20px; border: 3px solid #E0AE52; background: #33271C; color: #F3ECDD; padding: 18px; display: flex; flex-direction: column; gap: 10px">
          <span style="display: flex; justify-content: space-between; align-items: center; width: 100%">
            <span style="font-size: 26px; font-weight: 700">Century</span>
            <span style="width: 30px; height: 30px; border-radius: 50%; background: #E0AE52; color: #1B140D; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
          </span>
          <span style="font-size: 17px; color: #D9CDB8; line-height: 1.4">Any number of players. Charged by the minute under one player.</span>
          <span style="margin-top: auto; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 600">Rs 15 a minute</span>
        </button>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 18px; padding: 18px 20px; border-radius: 18px; background: #2B2119; border: 1px solid #3B2F25">
        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 300px">
          <label for="rate" style="font-size: 19px; font-weight: 700">Century rate for this game</label>
          <span style="font-size: 16px; color: #B9AC97">Starts at the owners’ price. Change it here if needed. Whole minutes are charged.</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <button aria-label="Lower rate by 1 rupee" style="width: 64px; height: 64px; border-radius: 16px; border: 1px solid #4A3B2E; background: #211913; color: #F3ECDD; font-size: 30px; font-weight: 600">−</button>
          <div style="display: flex; align-items: baseline; gap: 6px; padding: 0 16px; min-height: 64px; border-radius: 16px; background: #16110D; border: 2px solid #E0AE52; box-sizing: border-box">
            <span style="font-size: 18px; color: #B9AC97; align-self: center">Rs</span>
            <input id="rate" value="15" inputmode="numeric" style="width: 70px; background: transparent; border: 0; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 600; text-align: center; align-self: center">
            <span style="font-size: 16px; color: #B9AC97; align-self: center">a minute</span>
          </div>
          <button aria-label="Raise rate by 1 rupee" style="width: 64px; height: 64px; border-radius: 16px; border: 1px solid #4A3B2E; background: #211913; color: #F3ECDD; font-size: 30px; font-weight: 600">+</button>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-top: 4px">
        <button style="min-height: 60px; padding: 0 20px; border-radius: 14px; border: 1px solid #5A4A3C; background: transparent; color: #CDBFAE; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          Mark out of order
        </button>
        <div style="flex: 1 1 0"></div>
        <button style="min-height: 64px; padding: 0 26px; border-radius: 14px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-size: 19px; font-weight: 600">Cancel</button>
        <button style="min-height: 64px; padding: 0 32px; border-radius: 14px; border: 0; background: #E0AE52; color: #1B140D; font-size: 20px; font-weight: 700">Next: pick players</button>
      </div>
    </section>
  </main>
</div>

</body>
</html>
