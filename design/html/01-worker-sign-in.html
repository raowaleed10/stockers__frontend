<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>01 Worker sign-in</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Noto+Nastaliq+Urdu:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#16110D}
button{font:inherit;cursor:pointer}
a{color:#E0AE52}a:hover{color:#F0C670}
</style>

<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<div style="min-height: 900px; background: #16110D; color: #F3ECDD; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-wrap: wrap">

  <section style="flex: 1 1 520px; min-width: 0; background: #1E6B45; display: flex; flex-direction: column; justify-content: space-between; padding: 48px 56px; box-sizing: border-box; min-height: 420px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #F3ECDD; box-shadow: inset -7px -7px 0 rgba(0,0,0,0.18); display: inline-block"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: 0.5px">Stockers</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 132px; line-height: 0.9; font-variant-numeric: tabular-nums">9:42</span>
      <span style="font-size: 26px; font-weight: 500">PM, Saturday 3 October</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; font-size: 18px">
      <span style="font-weight: 600">Snooker club, Mian Plaza</span>
      <span style="color: #CFE5D7">Sheet 48 is open since 11:10 AM. 6 of 9 tables in use.</span>
    </div>
  </section>

  <section style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; box-sizing: border-box; gap: 28px">
    <div style="width: 100%; max-width: 540px; display: flex; justify-content: flex-end">
      <div role="group" aria-label="Language" style="display: flex; background: #211913; border: 1px solid #3B2F25; border-radius: 12px; padding: 4px">
        <button aria-pressed="true" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 9px; background: #3A2D21; color: #F3ECDD; font-weight: 600">English</button>
        <button aria-pressed="false" lang="ur" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; color: #B9AC97; font-family: 'Noto Nastaliq Urdu', serif; font-size: 15px">اردو</button>
      </div>
    </div>
    <div style="width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 22px">
      <h1 style="margin: 0; font-size: 34px; font-weight: 700">Who is working?</h1>
      <div style="display: flex; gap: 12px; flex-wrap: wrap">
        <button aria-pressed="false" style="flex: 1 1 200px; min-height: 112px; border-radius: 16px; border: 1px solid #3B2F25; background: #211913; color: #F3ECDD; display: flex; align-items: center; gap: 14px; padding: 0 18px; text-align: left">
          <span aria-hidden="true" style="flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; background: #4A3B2E; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">S</span>
          <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 22px; font-weight: 700">Shabir</span><span style="font-size: 15px; color: #B9AC97">2:00 AM to 10:00 AM</span><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #B9AC97"><span style="width: 9px; height: 9px; border-radius: 50%; background: #6B5640"></span>Not now</span></span>
        </button>
        <button aria-pressed="true" style="flex: 1 1 200px; min-height: 112px; border-radius: 16px; border: 2px solid #E0AE52; background: #2B2119; color: #F3ECDD; display: flex; align-items: center; gap: 14px; padding: 0 18px; text-align: left">
          <span aria-hidden="true" style="flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; background: #2F6B48; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">Z</span>
          <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 22px; font-weight: 700">Zain</span><span style="font-size: 15px; color: #B9AC97">2:00 PM to 11:00 PM</span><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8FDDB2"><span style="width: 9px; height: 9px; border-radius: 50%; background: #48C07F"></span>Your time now</span></span>
        </button>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px; background: #211913; border: 1px solid #3B2F25; border-radius: 20px">
        <label style="font-size: 18px; color: #B9AC97">Zain, enter your 4-digit PIN</label>
        <div aria-label="2 of 4 digits entered" style="display: flex; gap: 18px"><span style="width: 22px; height: 22px; border-radius: 50%; background: #E0AE52"></span><span style="width: 22px; height: 22px; border-radius: 50%; background: #E0AE52"></span><span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #6B5640; box-sizing: border-box"></span><span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #6B5640; box-sizing: border-box"></span></div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 380px">
          <button style="min-height: 76px; border-radius: 16px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 600">1</button><button style="min-height: 76px; border-radius: 16px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 600">2</button><button style="min-height: 76px; border-radius: 16px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 600">3</button><button style="min-height: 76px; border-radius: 16px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 600">4</button><button style="min-height: 76px; border-radius: 16px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 600">5</button><button style="min-height: 76px; border-radius: 16px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 600">6</button><button style="min-height: 76px; border-radius: 16px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 600">7</button><button style="min-height: 76px; border-radius: 16px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 600">8</button><button style="min-height: 76px; border-radius: 16px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 600">9</button>
          <button style="min-height: 76px; border-radius: 16px; border: 0; background: transparent; color: #B9AC97; font-size: 17px; font-weight: 600">Clear</button>
          <button style="min-height: 76px; border-radius: 16px; border: 1px solid #3B2F25; background: #2B2119; color: #F3ECDD; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 600">0</button>
          <button aria-label="Delete last digit" style="min-height: 76px; border-radius: 16px; border: 0; background: transparent; color: #B9AC97; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="m18 9-6 6M12 9l6 6"/></svg></button>
        </div>
      </div>
      <p style="margin: 0; font-size: 15px; color: #B9AC97; text-align: center">Your PIN works only in your sign-in time. Everything you do is saved with your name.</p>
    </div>
  </section>
</div>

</body>
</html>
